baseURL = "https://discretizations.earthsci.dev/"
languageCode = "en-us"
title = "EarthSciDiscretizations — Discretization Standard Library"
# No theme — layouts are provided directly under layouts/ (ported from the
# pre-0.8.0 archive site, archive/docs/).

# Use docs/ as the site root when building from this repo.
# CI invokes `hugo --source docs --minify --destination public`.

enableRobotsTXT = true

[params]
  description = "The ESM discretization standard library: grids, finite-difference/finite-volume rewrite rules, regridding and reprojection expressions, with cross-language conformance goldens."
  repoURL = "https://github.com/EarthSciML/earthscidiscretizations"
  # Client-side Pagefind search, ported from the archive site's setup
  # (archive/.github/workflows/docs.yml): CI runs `pagefind --site docs/public`
  # after the Hugo build, dropping the index + UI bundle under /pagefind/.
  # The head/header partials wire the UI only when this is enabled; the UI
  # script no-ops gracefully in a bare local `hugo` build with no index.
  pagefind = true

# Taxonomies drive faceted navigation, adapted to the 0.8.0 tags contract
# (AGENTS.md §4): `family:` -> families, `op:` -> ops, `bc:` -> bcs, plus the
# raw esd tags. Each key is the singular frontmatter field name; the value is
# the plural used in the URL (/families/finite_difference/, /ops/d2/, ...).
[taxonomies]
  family = "families"
  op = "ops"
  bc = "bcs"
  tag = "tags"

[markup]
  [markup.goldmark.renderer]
    # Allow raw HTML in generated markdown (<details>, <img>, <figure>).
    unsafe = true
  # Pass math delimiters through untouched so Goldmark does not mangle LaTeX
  # (underscores as emphasis, `\_` -> `_`, etc.). KaTeX auto-render then picks
  # up the raw `$$...$$` / `\(...\)` delimiters in the final HTML. Generated
  # pages render math as Unicode text in code spans; hand-written guide pages
  # may use LaTeX.
  [markup.goldmark.extensions.passthrough]
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
      block = [["\\[", "\\]"], ["$$", "$$"]]
      inline = [["\\(", "\\)"]]
  [markup.highlight]
    style = "github"
    lineNos = false
    codeFences = true

[outputs]
  home = ["HTML"]
  section = ["HTML"]
  taxonomy = ["HTML"]
  term = ["HTML"]

# Every generated grid page lives in its own directory as index.md (a page
# bundle) so it can carry sibling artifacts if ever needed.
[permalinks]
  grids = "/grids/:slug/"
