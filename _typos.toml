# Spellcheck (crate-ci/typos) configuration for the Conformance `validate` job.
#
# The workflow checks EarthSciAST out into ess/ inside this workspace, so an
# unconfigured scan lints the UPSTREAM repo's prose from this repo's gate;
# archive/ is frozen history. Neither is this repo's to spell.
[files]
extend-exclude = ["ess/", "archive/"]

[default.extend-words]
# Journal abbreviations in reference citations ("J. Comput. Phys.",
# "SIAM J. Numer. Anal.") — standard bibliographic forms, not typos.
Comput = "Comput"
Numer = "Numer"
# Hyphenated prefix in prose: "mis-fire", "mis-indexed", "mis-match".
mis = "mis"
