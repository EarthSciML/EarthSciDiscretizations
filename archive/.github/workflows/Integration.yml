name: "Integration Tests"

# Dedicated Layer-C integration CI job.  Runs the full ESD walker with
# ESD_RUN_INTEGRATION=1 so every rule with integration fixtures is exercised:
# the full ESM+GDD → build_ode_problem → ODE solve → tolerance-check pipeline.
#
# This job is intentionally separate from the unit-test job (Tests.yml) because
# the integration solve requires full ODE precompile time and is heavier than
# the structure/unit checks.  A regression in any integration case fails this
# job independently of the unit suite.

on:
  pull_request:
    branches:
      - main
      - 'release-'
    paths-ignore:
      - 'docs/**'
      - 'python/**'
      - 'rust/**'
      - 'typescript/**'
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'python/**'
      - 'rust/**'
      - 'typescript/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  integration:
    name: "Layer-C Integration"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: "Setup Julia"
        uses: julia-actions/setup-julia@v2
        with:
          version: "1"

      - uses: julia-actions/cache@v3
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"

      # EarthSciSerialization is not yet in the General registry.  Same
      # resolution script used by polecats and the unit-test CI job.
      - name: "Resolve unregistered deps (EarthSciSerialization)"
        run: scripts/setup_polecat_env.sh

      - uses: julia-actions/julia-buildpkg@v1

      # Run under the package test target (Pkg.test) so the test-only ODE solver
      # (OrdinaryDiffEqDefault, declared in [extras]+[targets].test rather than
      # [deps]) is on the load path for the integration cases' ODE solve. The
      # "integration" test arg routes runtests.jl to the Layer-C suite.
      - name: "Run Layer-C integration suite"
        run: julia --project=. -e 'using Pkg; Pkg.test(; test_args=["integration"])'
