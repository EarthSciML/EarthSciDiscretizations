name: "Documentation"

on:
  push:
    branches:
      - main
    tags: '*'
  pull_request:
  schedule:
    - cron: '57 0 * * 5'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch || github.ref != 'refs/tags/v*' }}

jobs:
  build-and-deploy-docs:
    name: "Documentation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: "Setup Julia"
        uses: julia-actions/setup-julia@v2
        with:
          version: "1"

      - uses: julia-actions/cache@v3
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"

      # EarthSciSerialization is not yet in the General registry. Develop a
      # local copy into the docs env before instantiate so Pkg can resolve the
      # ESS dep — without this Pkg.instantiate hits "no known versions" because
      # ESD's Project.toml lists ESS as a dep but ESS isn't on the registry.
      - name: "Install Dependencies"
        env:
          JULIA_PROJECT: docs/
        run: |
          julia --project=docs/ -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
          '
          scripts/setup_polecat_env.sh

      - name: "Build and Deploy Documentation"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
        run: julia --project=docs/ --code-coverage=user docs/make.jl

      - uses: julia-actions/julia-processcoverage@v1
        with:
          directories: "src"

      - name: "Report Coverage with Codecov"
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          flags: "docs"
          token: "${{ secrets.CODECOV_TOKEN }}"
          fail_ci_if_error: true
