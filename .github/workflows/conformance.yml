name: Conformance

on:
  push:
    branches: [main]
    paths:
      - "grids/**"
      - "regridding/**"
      - "reprojection/**"
      - "problems/**"
      - "tests/**"
      - "scripts/**"
      - "_typos.toml"
      - ".github/workflows/conformance.yml"
  pull_request:
    paths:
      - "grids/**"
      - "regridding/**"
      - "reprojection/**"
      - "problems/**"
      - "tests/**"
      - "scripts/**"
      - "_typos.toml"
      - ".github/workflows/conformance.yml"
  workflow_dispatch:

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast checks that need no language bindings: schema validation of every
  # library file, the policy lint (AGENTS.md tags contract), lint-fixture
  # expectations, and spellcheck.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: EarthSciML/EarthSciAST
          path: ess
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install jsonschema
        run: pip install jsonschema
      # Diagnostic, not a gate. This repo's corpus and the upstream schema move
      # in lockstep (L008 derives the expected `esm` version from the schema's
      # $id), so an upstream major bump turns every library file into a finding
      # at once. Printing the version the run is actually validating against
      # makes that failure mode readable in one line instead of 509.
      - name: Upstream esm schema version
        run: |
          echo "EarthSciAST: $(git -C ess rev-parse --short HEAD)"
          jq -r '."$id"' ess/esm-schema.json
      - name: Validate library (schema + policy lint)
        run: ESS_ROOT="$PWD/ess" python scripts/validate-library.py
      - name: Lint-fixture expectations
        run: ESS_ROOT="$PWD/ess" python scripts/validate-library.py --invalid
      - name: Convergence order check
        run: python scripts/check_convergence_order.py
      - name: Spellcheck
        uses: crate-ci/typos@v1

  # The Julia reference binding: runs the official runner
  # (scripts/runners/run-julia.jl) for every category — ast + simulation +
  # convergence plus the julia-scoped regridding (per-pair A_ij/A_j/W_ij via
  # the BuildInspection surface) and reprojection point gates — and gates
  # every output against the committed goldens with scripts/compare-outputs.py.
  julia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: EarthSciML/EarthSciAST
          path: ess
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: julia-actions/cache@v2
      - name: Instantiate the ESS Julia binding
        run: |
          julia --project=ess/pkg/EarthSciAST.jl \
            -e 'using Pkg; Pkg.instantiate()'
      - name: Conformance (julia; all categories)
        run: |
          ESS_ROOT="$PWD/ess" ./scripts/test-conformance.sh \
            --bindings julia \
            --categories ast,simulation,convergence,regridding,reprojection
      - name: Upload runner outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-results-julia
          path: conformance-results/

  # The Python binding (earthsci_ast): full category coverage — ast bytes,
  # §6.6.5 simulation + convergence via pde_inline_tests/run_pde_tests,
  # regridding invariants, reprojection points (scripts/runners/run-python.py).
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: EarthSciML/EarthSciAST
          path: ess
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ess/pkg/earthsci-ast-py/pyproject.toml
      - name: Install earthsci_ast
        # phase-6 H-4: SciPy is NOT a base dependency of earthsci-ast (a library
        # must not embed a solver; esm-libraries-spec §2.4/§2.5.9). The
        # simulation and convergence categories below integrate trajectories
        # through `pde_inline_tests.run_pde_tests` -> `solve`, so the solver is
        # asked for by name via the `simulate` extra.
        run: pip install -e "ess/pkg/earthsci-ast-py[simulate]"
      - name: Conformance (python; all categories)
        run: |
          ESS_ROOT="$PWD/ess" ./scripts/test-conformance.sh \
            --bindings python \
            --categories ast,simulation,convergence,regridding,reprojection
      - name: Upload runner outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-results-python
          path: conformance-results/

  # The Rust binding (earthsci-ast-rs): ast bytes (upstream canonical_expand)
  # plus the numeric categories for every case Rust can solve. The nonlinear /
  # high-order / genuinely-stiff-2-D cases whose ODE hangs the diffsol integrator
  # (no dtmin/max-step guard; Erk/Bdf/Sdirk all wedge) are marked
  # blocked_upstream_bindings.rust in their manifests and skip cleanly here.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: EarthSciML/EarthSciAST
          path: ess
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ess/pkg/earthsci-ast-rs
      - name: Conformance (rust; ast + numeric)
        run: |
          ESS_ROOT="$PWD/ess" ./scripts/test-conformance.sh \
            --bindings rust \
            --categories ast,simulation,convergence,regridding,reprojection
      - name: Upload runner outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-results-rust
          path: conformance-results/

  # The TypeScript binding (earthsci-ast-ts): ast bytes over the built dist
  # (scripts/runners/run-typescript.js). Rewrite-only port — see the
  # manifests' scope_excluded notes.
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: EarthSciML/EarthSciAST
          path: ess
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ess/pkg/earthsci-ast-ts/package-lock.json
      - name: Build earthsci-ast-ts dist
        working-directory: ess/pkg/earthsci-ast-ts
        run: |
          npm ci
          npm run build
      - name: Conformance (typescript; ast)
        run: |
          ESS_ROOT="$PWD/ess" ./scripts/test-conformance.sh \
            --bindings typescript --categories ast
      - name: Upload runner outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-results-typescript
          path: conformance-results/

  # The Go binding (earthsci-ast-go): ast bytes via esm.ResolveAndLower
  # (scripts/runners/run-go.sh). Rewrite-only port — see the manifests'
  # scope_excluded notes.
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: EarthSciML/EarthSciAST
          path: ess
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: ess/pkg/earthsci-ast-go/go.sum
      - name: Conformance (go; ast)
        run: |
          ESS_ROOT="$PWD/ess" ./scripts/test-conformance.sh \
            --bindings go --categories ast
      - name: Upload runner outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-results-go
          path: conformance-results/

  # Cross-binding gate: pull every binding's runner outputs together and apply
  # the full comparison contract (byte-identity vs goldens AND vs the Julia
  # reference; simulation actuals at rtol 1e-9; convergence error norms at the
  # manifests' error_vs_golden_* tolerances) in one place.
  compare:
    runs-on: ubuntu-latest
    needs: [julia, python, rust, typescript, go]
    if: always() && !cancelled()
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: conformance-results-*
          path: conformance-results
          merge-multiple: true
      - name: Cross-binding comparison
        run: |
          python3 scripts/compare-outputs.py \
            --results-root conformance-results \
            --bindings julia,python,rust,typescript,go \
            --categories ast,simulation,convergence,regridding,reprojection
      - name: Upload comparison summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-summary
          path: conformance-results/comparison/
