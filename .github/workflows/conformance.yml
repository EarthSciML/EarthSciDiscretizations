name: Conformance

on:
  push:
    branches: [main]
    paths:
      - "grids/**"
      - "regridding/**"
      - "reprojection/**"
      - "problems/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/conformance.yml"
  pull_request:
    paths:
      - "grids/**"
      - "regridding/**"
      - "reprojection/**"
      - "problems/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/conformance.yml"
  workflow_dispatch:

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast checks that need no language bindings: schema validation of every
  # library file, the policy lint (AGENTS.md tags contract), lint-fixture
  # expectations, and spellcheck.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: EarthSciML/EarthSciSerialization
          path: ess
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install jsonschema
        run: pip install jsonschema
      - name: Validate library (schema + policy lint)
        run: ESS_ROOT="$PWD/ess" python scripts/validate-library.py
      - name: Lint-fixture expectations
        run: ESS_ROOT="$PWD/ess" python scripts/validate-library.py --invalid
      - name: Convergence order check
        run: python scripts/check_convergence_order.py
      - name: Spellcheck
        uses: crate-ci/typos@v1

  # The Julia reference binding: runs the official runner
  # (scripts/runners/run-julia.jl) for ast + simulation + convergence and gates
  # every output against the committed goldens with scripts/compare-outputs.py.
  # Further per-binding jobs (python, rust, go, typescript) drop into the same
  # shape as their ESS §9.7 ports land (AGENTS.md "Phasing").
  julia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: EarthSciML/EarthSciSerialization
          path: ess
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: julia-actions/cache@v2
      - name: Instantiate the ESS Julia binding
        run: |
          julia --project=ess/packages/EarthSciSerialization.jl \
            -e 'using Pkg; Pkg.instantiate()'
      - name: Conformance (julia; ast + simulation + convergence)
        run: |
          ESS_ROOT="$PWD/ess" ./scripts/test-conformance.sh \
            --bindings julia --categories ast,simulation,convergence
      - name: Upload runner outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-results-julia
          path: conformance-results/
