name: "Tests"

on:
  pull_request:
    branches:
      - main
      - 'release-'
    paths-ignore:
      - 'docs/**'
      - 'python/**'
      - 'rust/**'
      - 'typescript/**'
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'python/**'
      - 'rust/**'
      - 'typescript/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tests:
    name: "Tests"
    strategy:
      fail-fast: false
      matrix:
        # Julia 1.11+ required: Project.toml uses [sources] to resolve the
        # unregistered EarthSciSerialization dep, a feature added in 1.11.
        # Drop lts (currently 1.10) until ESS lands on the General registry.
        version:
          - "1"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: "Setup Julia ${{ matrix.version }}"
        uses: julia-actions/setup-julia@v2
        with:
          version: "${{ matrix.version }}"

      - uses: julia-actions/cache@v3
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"

      # EarthSciSerialization is not yet in the General registry. The setup
      # script Pkg.develops a local checkout when available, or falls back to
      # Pkg.add(url=...) from GitHub. Same script polecats run locally.
      - name: "Resolve unregistered deps (EarthSciSerialization)"
        run: scripts/setup_polecat_env.sh

      - uses: julia-actions/julia-buildpkg@v1

      - name: "Run tests"
        uses: julia-actions/julia-runtest@v1
        with:
          depwarn: "yes"

      - uses: julia-actions/julia-processcoverage@v1
        with:
          directories: "src"

      - name: "Report Coverage with Codecov"
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: "${{ secrets.CODECOV_TOKEN }}"
          fail_ci_if_error: true
