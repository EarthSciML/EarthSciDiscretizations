name: Downgrade
on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
  schedule:
    - cron: '44 4 * * 4'
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1'
        os:
          - ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/julia-downgrade-compat@v2
        with:
          # EarthSciSerialization is not yet in the General registry; the
          # downgrade-compat action would fail to look it up for a lower bound
          # ("unknown package UUID: c7bf5e87-..."). Skip it — ESD's [sources]
          # table resolves ESS directly from GitHub regardless of compat.
          skip: Pkg,TOML,Statistics,Random,EarthSciSerialization
      - uses: julia-actions/cache@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
