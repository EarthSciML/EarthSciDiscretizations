name: "Fornberg regen-check"

on:
  pull_request:
    branches:
      - main
      - 'release-'
    paths:
      - 'tools/fornberg_gen.py'
      - 'discretizations/finite_difference/centered_4th_uniform.json'
      - 'discretizations/finite_difference/centered_6th_uniform.json'
      - 'discretizations/finite_difference/centered_8th_uniform.json'
      - 'discretizations/finite_difference/centered_2nd_deriv_uniform.json'
      - 'discretizations/finite_difference/centered_4th_deriv_uniform.json'
      - 'discretizations/finite_difference/centered_6th_deriv_uniform.json'
      - 'discretizations/finite_difference/centered_8th_deriv_uniform.json'
      - '.github/workflows/FornbergCheck.yml'
  push:
    branches:
      - main
    paths:
      - 'tools/fornberg_gen.py'
      - 'discretizations/finite_difference/centered_4th_uniform.json'
      - 'discretizations/finite_difference/centered_6th_uniform.json'
      - 'discretizations/finite_difference/centered_8th_uniform.json'
      - 'discretizations/finite_difference/centered_2nd_deriv_uniform.json'
      - 'discretizations/finite_difference/centered_4th_deriv_uniform.json'
      - 'discretizations/finite_difference/centered_6th_deriv_uniform.json'
      - 'discretizations/finite_difference/centered_8th_deriv_uniform.json'
      - '.github/workflows/FornbergCheck.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: "Fornberg regen-check (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - uses: actions/checkout@v6

      - name: "Set up Python ${{ matrix.python-version }}"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: "Verify generated rules match committed JSON"
        run: python tools/fornberg_gen.py --check
