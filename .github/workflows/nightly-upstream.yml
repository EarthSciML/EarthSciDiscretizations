name: Nightly upstream drift

# Runs the full validate + conformance suite against EarthSciAST main
# HEAD (instead of the pinned PR-time checkout) so upstream lowering or
# canonicalization changes surface here before they break a PR. Opens an issue
# on failure.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: EarthSciML/EarthSciAST
          ref: main
          path: ess
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install jsonschema
        run: pip install jsonschema
      # Diagnostic, not a gate — the first thing to look at when this run goes
      # red. An upstream `esm` version bump makes L008 fire on every library
      # file at once (the expected version derives from the schema's $id), and
      # a major bump additionally makes upstream's parser reject this corpus
      # outright; both look like mass failure without this line.
      - name: Upstream esm schema version
        run: |
          echo "EarthSciAST main: $(git -C ess rev-parse --short HEAD)"
          jq -r '."$id"' ess/esm-schema.json
      - name: Validate library against upstream HEAD schema
        run: ESS_ROOT="$PWD/ess" python scripts/validate-library.py
      - name: Lint-fixture expectations
        run: ESS_ROOT="$PWD/ess" python scripts/validate-library.py --invalid
      - name: Convergence order check
        run: python scripts/check_convergence_order.py
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.11"
      - name: Instantiate upstream Julia binding
        run: julia --project=ess/pkg/EarthSciAST.jl -e 'using Pkg; Pkg.instantiate()'
      - name: Julia conformance against upstream HEAD
        run: ESS_ROOT="$PWD/ess" ./scripts/test-conformance.sh --bindings julia
      - name: Open issue on drift
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Nightly upstream drift: conformance vs EarthSciAST main failed (${new Date().toISOString().slice(0,10)})`;
            const open = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: "open", labels: "upstream-drift" });
            if (open.data.some(i => i.title.startsWith("Nightly upstream drift"))) return;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo, title,
              labels: ["upstream-drift"],
              body: `The nightly run against EarthSciAST main HEAD failed: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nCheck the "Upstream esm schema version" step first. Three causes, in decreasing likelihood:\n\n1. **Upstream bumped the \`esm\` version.** L008 derives the expected version from the schema's \`$id\`, so every library file becomes a finding at once; a MAJOR bump also makes upstream's parser reject this corpus outright, taking every binding job with it. The fix is a corpus migration here, not a change to the lint.\n2. **Upstream changed lowering/canonicalization.** Regenerate goldens with a stated cause per AGENTS.md §5 — never "refreshed to green".\n3. **A real regression landed upstream.** File it there.`
            });
