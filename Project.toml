[sources]
EarthSciSerialization = {rev = "main", subdir = "packages/EarthSciSerialization.jl", url = "https://github.com/EarthSciML/EarthSciSerialization.git"}

[compat]
DomainSets = "0.7"
EarthSciSerialization = "0.6.0"
GeoInterface = "1"
GeometryOps = "0.1"
# JSON >= 1.5.1, pinned to the higher of two version-gated behaviors the
# code and tests depend on (both regressed under the Downgrade job, which
# otherwise resolves JSON 1.0.0):
#  (1) ESS's rule parser indexes JSON.jl objects with Symbol keys (`obj[:op]`);
#      Symbol->String coercion in getindex/get for String-keyed JSON.Object was
#      added in v1.4.0 (earlier throws find_node_by_key(::JSON.Object,::Symbol)).
#  (2) the .esm Layer-A byte-contract tests compare JSON.print(::Dict, 2) output
#      to alphabetically-sorted goldens; default key sorting for Dict was added
#      in v1.5.1 (_sort_keys_by_default). Below it JSON.print emits hash order
#      and the byte-diff fails.
JSON = "1.5.1"
ModelingToolkit = "11.22"
OrdinaryDiffEqDefault = "1"
SciMLBase = "2.155"
SymbolicUtils = "4.24"
Symbolics = "7.19"
julia = "1.11"

[extras]
GeoInterface = "cf35fbd7-0cd7-5166-be24-54bfbe79505f"
GeometryOps = "3251bfac-6a57-4b6d-aa61-ac1fef2975ab"
JSON = "682c06a0-de6a-54ab-a142-c8b1cf79cde6"
OrdinaryDiffEqDefault = "50262376-6c5a-4cf5-baba-aaf4f84d72d7"
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"
TestItemRunner = "f8b46487-2199-4994-9208-9a1283c18c0a"
TestItems = "1c621080-faea-4a02-84b6-bbd5e436b8fe"

[targets]
test = ["GeoInterface", "GeometryOps", "JSON", "OrdinaryDiffEqDefault", "Test", "TestItemRunner", "TestItems"]
